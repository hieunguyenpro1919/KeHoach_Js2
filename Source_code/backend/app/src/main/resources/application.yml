server:
  port: ${PORT:8080}

spring:
  application:
    name: medsched
  main:
    allow-bean-definition-overriding: true

  # Cấu hình DataSource trực tiếp: Tự động dùng DB_URL (Aiven Cloud trên Render),
  # nếu không có sẽ tự fallback về localhost (XAMPP cho các thành viên trong nhóm).
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medsched_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 5000

  # Chỉ định rõ ràng MySQLDialect để Hibernate không cần thăm dò JDBC metadata khi start
  # Tránh lỗi: Unable to determine Dialect without JDBC metadata
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Cấu hình Mail Gmail SMTP gửi OTP xác thực (có đầy đủ fallback mặc định)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:kietphuchau@gmail.com}
    password: ${MAIL_PASSWORD:tfloxaswoahvffmz}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-medsched-local-api-key}

# Spring AI fallback key
spring.ai.openai.api-key: ${OPENAI_API_KEY:chua-cau-hinh}

